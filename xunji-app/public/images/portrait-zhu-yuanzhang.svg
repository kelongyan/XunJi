<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EFE0"/>
      <stop offset="100%" stop-color="#E9DFC8"/>
    </linearGradient>
    <filter id="inkRough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#paperBg)"/>
  
  <!-- 仿古籍内衬边框 -->
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#8C8378" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="28" y="28" width="544" height="344" fill="none" stroke="#1F1B16" stroke-width="2"/>

  <!-- 背景金石水墨山峦线描 -->
  <path d="M 40 320 Q 150 200 260 290 T 480 230 T 560 310" fill="none" stroke="#8C8378" stroke-width="1.5" opacity="0.4"/>
  <path d="M 30 330 Q 180 240 320 310 T 570 270" fill="none" stroke="#B08D57" stroke-width="1" opacity="0.3"/>

  <!-- 人物坐姿画像古意白描轮廓 -->
  <g transform="translate(180, 55)" stroke="#1F1B16" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 翼善冠 -->
    <path d="M 85 45 C 85 20, 155 20, 155 45 Z" fill="#3D372F"/>
    <path d="M 98 25 C 105 5, 135 5, 142 25" stroke="#B08D57" stroke-width="2"/>
    <path d="M 120 10 L 120 2" stroke="#B08D57" stroke-width="2"/>
    <path d="M 112 2 L 128 2" stroke="#B08D57" stroke-width="2"/>
    
    <!-- 面部与长髯 -->
    <path d="M 92 45 Q 120 50 148 45 L 145 85 Q 120 110 95 85 Z" fill="#F7F3E8"/>
    <!-- 五官微线 -->
    <path d="M 104 60 Q 112 58 116 61" stroke-width="1.5"/>
    <path d="M 124 61 Q 128 58 136 60" stroke-width="1.5"/>
    <path d="M 120 62 L 118 72 L 122 73" stroke-width="1.5"/>
    <path d="M 110 80 Q 120 84 130 80" stroke-width="1.5"/>
    <!-- 威严五绺长须 -->
    <path d="M 102 82 Q 98 120 112 135 Q 120 140 128 135 Q 142 120 138 82" fill="#1F1B16"/>
    
    <!-- 团龙衮服与宽袍大袖 -->
    <path d="M 95 90 L 40 130 L 10 240 L 80 250 L 90 170 L 120 180 L 150 170 L 160 250 L 230 240 L 200 130 L 145 90 Z" fill="#EFE7D3" stroke="#1F1B16" stroke-width="2.5"/>
    <!-- 领口与玉带 -->
    <path d="M 95 90 Q 120 115 145 90" stroke-width="2"/>
    <path d="M 75 185 L 165 185 L 160 198 L 80 198 Z" fill="#B08D57" stroke="#1F1B16" stroke-width="1.5"/>
    <!-- 补子/胸前团龙祥云简纹 -->
    <circle cx="120" cy="140" r="22" stroke="#A8352A" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
    <path d="M 112 135 Q 120 128 128 135 Q 120 148 112 142" stroke="#A8352A" stroke-width="2"/>
  </g>

  <!-- 右侧题签印章 -->
  <g transform="translate(470, 50)">
    <!-- 竖排题签框 -->
    <rect x="0" y="0" width="36" height="150" fill="#F7F3E8" stroke="#A8352A" stroke-width="1.5"/>
    <text x="18" y="25" font-family="serif" font-weight="bold" font-size="14" fill="#A8352A" text-anchor="middle">明</text>
    <text x="18" y="45" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">太</text>
    <text x="18" y="65" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">祖</text>
    <text x="18" y="85" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">坐</text>
    <text x="18" y="105" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">像</text>
    <text x="18" y="130" font-family="serif" font-size="10" fill="#8C8378" text-anchor="middle">摹本</text>
  </g>

  <!-- 左下角金石朱红方印 -->
  <g transform="translate(45, 290)">
    <rect x="0" y="0" width="46" height="46" fill="#A8352A" rx="2"/>
    <rect x="3" y="3" width="40" height="40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="23" y="22" font-family="serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">洪武</text>
    <text x="23" y="37" font-family="serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">御览</text>
  </g>

  <!-- 底部图注小字 -->
  <text x="300" y="380" font-family="serif" font-size="11" fill="#8C8378" text-anchor="middle">
    图版 1-1　明太祖朱元璋冠服坐像（故宫博物院藏正容摹本白描）
  </text>
</svg>
