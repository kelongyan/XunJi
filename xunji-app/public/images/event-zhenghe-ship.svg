<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="paperOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3E8"/>
      <stop offset="100%" stop-color="#EAE3D1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#paperOcean)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#8C8378" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="28" y="28" width="544" height="344" fill="none" stroke="#1F1B16" stroke-width="2"/>

  <!-- 波涛汹涌传统海水江崖海浪 -->
  <g stroke="#2F5D7C" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 30 330 C 70 300, 110 350, 150 330 C 190 310, 230 350, 270 330 C 310 310, 350 350, 390 330 C 430 310, 470 350, 510 330 T 570 330"/>
    <path d="M 30 345 C 80 325, 130 365, 180 345 C 230 325, 280 365, 330 345 C 380 325, 430 365, 480 345 T 570 345"/>
  </g>

  <!-- 郑和下西洋核心大福船（九桅巨舶）古意工笔线描 -->
  <g transform="translate(130, 40)" stroke="#1F1B16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 巨型船体 -->
    <path d="M 30 250 L 320 250 L 350 200 L 330 170 L 10 180 L 15 220 Z" fill="#F4EFE0" stroke-width="2.5"/>
    <path d="M 10 180 L 330 170" stroke-width="2"/>
    <path d="M 20 215 L 340 215" stroke-width="1.2" stroke-dasharray="3 3"/>
    
    <!-- 船头高昂与鹢首 -->
    <path d="M 10 180 Q -10 150 0 130 L 25 150 Z" fill="#E3D9C0"/>
    
    <!-- 主桅杆一 (中桅) -->
    <line x1="170" y1="170" x2="170" y2="30" stroke="#1F1B16" stroke-width="3"/>
    <!-- 巨型硬席硬帆横桁结构 -->
    <path d="M 170 45 L 235 55 L 230 160 L 170 155 Z" fill="#EFE7D3" stroke="#1F1B16" stroke-width="1.8"/>
    <line x1="170" y1="65" x2="234" y2="75" stroke="#8C8378" stroke-width="1.2"/>
    <line x1="170" y1="90" x2="233" y2="100" stroke="#8C8378" stroke-width="1.2"/>
    <line x1="170" y1="115" x2="232" y2="125" stroke="#8C8378" stroke-width="1.2"/>
    <line x1="170" y1="140" x2="231" y2="150" stroke="#8C8378" stroke-width="1.2"/>

    <!-- 头桅 (前帆) -->
    <line x1="80" y1="175" x2="80" y2="65" stroke="#1F1B16" stroke-width="2.5"/>
    <path d="M 80 80 L 130 90 L 126 165 L 80 160 Z" fill="#EFE7D3" stroke="#1F1B16" stroke-width="1.5"/>
    <line x1="80" y1="100" x2="129" y2="110" stroke="#8C8378"/>
    <line x1="80" y1="125" x2="128" y2="135" stroke="#8C8378"/>

    <!-- 尾桅 (后帆与旌旗) -->
    <line x1="270" y1="175" x2="270" y2="75" stroke="#1F1B16" stroke-width="2.2"/>
    <path d="M 270 90 L 310 98 L 306 165 L 270 160 Z" fill="#EFE7D3" stroke="#1F1B16" stroke-width="1.5"/>
    <!-- 桅顶三角信标朱红令旗 -->
    <path d="M 170 30 L 140 22 L 170 15 Z" fill="#A8352A" stroke="#A8352A"/>
    <path d="M 80 65 L 60 58 L 80 52 Z" fill="#A8352A" stroke="#A8352A"/>
  </g>

  <!-- 远方伴航船队小剪影 -->
  <g transform="translate(60, 180)" stroke="#8C8378" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 10 30 L 60 30 L 65 20 L 5 22 Z"/>
    <line x1="35" y1="20" x2="35" y2="0"/>
    <path d="M 35 3 L 50 8 L 48 20 L 35 18 Z"/>
  </g>

  <!-- 题签 -->
  <g transform="translate(480, 50)">
    <rect x="0" y="0" width="36" height="160" fill="#F7F3E8" stroke="#A8352A" stroke-width="1.5"/>
    <text x="18" y="24" font-family="serif" font-weight="bold" font-size="13" fill="#A8352A" text-anchor="middle">郑</text>
    <text x="18" y="44" font-family="serif" font-weight="bold" font-size="13" fill="#A8352A" text-anchor="middle">和</text>
    <text x="18" y="66" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">宝</text>
    <text x="18" y="88" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">船</text>
    <text x="18" y="110" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">出</text>
    <text x="18" y="132" font-family="serif" font-weight="bold" font-size="14" fill="#1F1B16" text-anchor="middle">海</text>
    <text x="18" y="150" font-family="serif" font-size="9" fill="#8C8378" text-anchor="middle">画谱</text>
  </g>

  <!-- 左下角航海图方印 -->
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="46" height="46" fill="#A8352A" rx="2"/>
    <rect x="3" y="3" width="40" height="40" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="23" y="22" font-family="serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">西洋</text>
    <text x="23" y="37" font-family="serif" font-weight="bold" font-size="12" fill="#FFFFFF" text-anchor="middle">通使</text>
  </g>

  <text x="300" y="380" font-family="serif" font-size="11" fill="#8C8378" text-anchor="middle">
    图版 3-1　大明永乐年间郑和下西洋四十四丈福船宝船形制图（依据古船谱白描摹绘）
  </text>
</svg>
