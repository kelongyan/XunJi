<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="classicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE1"/>
      <stop offset="100%" stop-color="#EBE0C7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#classicBg)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#8C8378" stroke-width="1" stroke-dasharray="4 2"/>
  <rect x="28" y="28" width="544" height="344" fill="none" stroke="#1F1B16" stroke-width="2"/>

  <!-- 仿线装包角古籍书函开卷 -->
  <g transform="translate(130, 50)">
    <!-- 书本阴影 -->
    <rect x="15" y="15" width="320" height="250" fill="#E3D9C0" opacity="0.6"/>
    <!-- 书本主体包背装 -->
    <rect x="0" y="0" width="320" height="250" fill="#F7F3E8" stroke="#1F1B16" stroke-width="2.5"/>
    
    <!-- 经典右侧线装装订线四眼钉孔 -->
    <line x1="280" y1="0" x2="280" y2="250" stroke="#8C8378" stroke-width="1.2" stroke-dasharray="2 3"/>
    <circle cx="280" cy="35" r="4" fill="#1F1B16"/>
    <circle cx="280" cy="95" r="4" fill="#1F1B16"/>
    <circle cx="280" cy="155" r="4" fill="#1F1B16"/>
    <circle cx="280" cy="215" r="4" fill="#1F1B16"/>
    <!-- 穿线细线描绘 -->
    <line x1="280" y1="35" x2="320" y2="35" stroke="#A8352A" stroke-width="2"/>
    <line x1="280" y1="95" x2="320" y2="95" stroke="#A8352A" stroke-width="2"/>
    <line x1="280" y1="155" x2="320" y2="155" stroke="#A8352A" stroke-width="2"/>
    <line x1="280" y1="215" x2="320" y2="215" stroke="#A8352A" stroke-width="2"/>
    <line x1="280" y1="0" x2="280" y2="250" stroke="#A8352A" stroke-width="2"/>

    <!-- 封面朱红题签签条 -->
    <rect x="210" y="25" width="42" height="180" fill="#F7F3E8" stroke="#A8352A" stroke-width="1.8"/>
    <text x="231" y="55" font-family="serif" font-weight="black" font-size="16" fill="#1F1B16" text-anchor="middle">永</text>
    <text x="231" y="80" font-family="serif" font-weight="black" font-size="16" fill="#1F1B16" text-anchor="middle">樂</text>
    <text x="231" y="105" font-family="serif" font-weight="black" font-size="16" fill="#1F1B16" text-anchor="middle">大</text>
    <text x="231" y="130" font-family="serif" font-weight="black" font-size="16" fill="#1F1B16" text-anchor="middle">典</text>
    <text x="231" y="165" font-family="serif" font-size="11" fill="#8C8378" text-anchor="middle">卷八千</text>
    <text x="231" y="185" font-family="serif" font-size="11" fill="#8C8378" text-anchor="middle">七百七</text>

    <!-- 书皮明黄色锦缎祥云暗纹 -->
    <path d="M 40 40 Q 60 25 80 40 Q 100 55 120 40" stroke="#B08D57" stroke-width="1.2" fill="none" opacity="0.4"/>
    <path d="M 40 100 Q 60 85 80 100 Q 100 115 120 100" stroke="#B08D57" stroke-width="1.2" fill="none" opacity="0.4"/>
    <path d="M 40 160 Q 60 145 80 160 Q 100 175 120 160" stroke="#B08D57" stroke-width="1.2" fill="none" opacity="0.4"/>

    <!-- 太子少保解缙监修小方印 -->
    <rect x="40" y="185" width="36" height="36" fill="#A8352A" rx="1"/>
    <text x="58" y="202" font-family="serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">文渊</text>
    <text x="58" y="215" font-family="serif" font-weight="bold" font-size="9" fill="#FFFFFF" text-anchor="middle">阁印</text>
  </g>

  <!-- 藏书印朱红大印记 -->
  <g transform="translate(480, 70)">
    <rect x="0" y="0" width="50" height="90" fill="#A8352A" rx="2"/>
    <rect x="3" y="3" width="44" height="84" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <text x="25" y="25" font-family="serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">文</text>
    <text x="25" y="45" font-family="serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">华</text>
    <text x="25" y="65" font-family="serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">殿</text>
    <text x="25" y="82" font-family="serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">宝</text>
  </g>

  <text x="300" y="380" font-family="serif" font-size="11" fill="#8C8378" text-anchor="middle">
    图版 4-1　《永乐大典》嘉靖副本开本封皮与书函（按国家图书馆善本部藏本考绘）
  </text>
</svg>
